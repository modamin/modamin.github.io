<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="Mohamed Amin" name="author"/>
<title>Blog | Mohamed Amin</title>
<script>
    (() => {
      let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
      } catch {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>:root {
  color-scheme: light;
  --bg: #ffffff;
  --bg-soft: #f4f5f5;
  --text: #16181a;
  --muted: #5d6267;
  --faint: #9aa0a4;
  --accent: #2c7d51;
  --line: rgba(20, 22, 24, 0.10);
  --line-soft: rgba(20, 22, 24, 0.055);
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0e0f;
  --bg-soft: #17191a;
  --text: #e9eaeb;
  --muted: #8e9398;
  --faint: #5c6064;
  --accent: #56b181;
  --line: rgba(233, 234, 235, 0.12);
  --line-soft: rgba(233, 234, 235, 0.06);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0 28px;
  background: var(--bg);
  color: var(--text);
  font-family: "Hanken Grotesk", sans-serif;
  font-size: 17px;
  line-height: 1.65;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent); color: var(--bg); }
.wrap { max-width: 680px; margin: 0 auto; }
a { color: var(--accent); text-underline-offset: 4px; overflow-wrap: anywhere; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding-top: 32px;
}
.monogram {
  font-family: "JetBrains Mono", monospace;
  font-size: 0.78rem;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
}
.toggle {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  display: grid;
  place-items: center;
}
.toggle[hidden] { display: none; }
.toggle:hover { border-color: var(--accent); }
.theme-icon {
  display: block;
  width: 16px;
  height: 16px;
  border: 1px solid currentColor;
  border-radius: 50%;
  background: linear-gradient(90deg, currentColor 50%, transparent 50%);
}
.post-header { padding: 78px 0 40px; border-bottom: 1px solid var(--line); }
.eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 0.74rem;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 22px;
}
h1, h2, h3, h4, h5, h6 {
  font-family: "Schibsted Grotesk", sans-serif;
  font-weight: 600;
  color: var(--text);
  overflow-wrap: anywhere;
}
h1 { font-size: 2.75rem; line-height: 1.12; margin: 0 0 26px; }
.lede { font-size: 1.15rem; color: var(--muted); margin: 0 0 26px; }
.post-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
  font-family: "JetBrains Mono", monospace;
  font-size: 0.76rem;
  color: var(--muted);
}
.post-meta a { color: inherit; text-decoration: none; }
.post-content { padding: 14px 0 38px; overflow-wrap: anywhere; }
.post-content > :first-child { margin-top: 24px; }
.post-content h2 { font-size: 1.6rem; line-height: 1.3; margin: 44px 0 18px; }
.post-content h3 { font-size: 1.25rem; line-height: 1.4; margin: 32px 0 14px; }
.post-content p, .post-content ul, .post-content ol { margin: 0 0 22px; }
.post-content ul, .post-content ol { padding-left: 26px; }
.post-content li { padding-left: 4px; margin: 6px 0; }
.post-content li > ul, .post-content li > ol { margin-bottom: 0; }
.post-content blockquote {
  margin: 28px 0;
  padding: 4px 0 4px 22px;
  border-left: 3px solid var(--accent);
  color: var(--muted);
}
.post-content blockquote > :last-child { margin-bottom: 0; }
code, pre { font-family: "JetBrains Mono", monospace; font-size: 0.85em; }
code { background: var(--bg-soft); padding: 2px 5px; border-radius: 3px; }
pre {
  margin: 26px 0;
  padding: 20px;
  overflow-x: auto;
  background: var(--bg-soft);
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  line-height: 1.7;
}
pre code { font-size: inherit; padding: 0; background: transparent; }
.table-scroll { max-width: 100%; overflow-x: auto; margin: 26px 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
th, td { padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: left; }
th { background: var(--bg-soft); font-weight: 600; color: var(--text); }
img, video { display: block; max-width: 100%; height: auto; margin: 26px auto; }
iframe { max-width: 100%; }
hr { border: 0; border-top: 1px solid var(--line); margin: 36px 0; }
footer {
  padding: 40px 0 56px;
  border-top: 1px solid var(--line-soft);
  margin-top: 22px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 0.76rem;
  color: var(--muted);
}
footer nav { display: flex; gap: 18px; flex-wrap: wrap; }
footer a { color: var(--muted); text-decoration: none; }
footer a:hover, .post-meta a:hover, .monogram:hover { color: var(--accent); }
.post-navigation { margin-top: 38px; font-size: 0.85rem; }
.post-navigation + .post-header { padding-top: 32px; }
.home-header { padding: 78px 0 48px; }
.home-header h1 { font-size: 3.8rem; }
.home-links { display: flex; flex-wrap: wrap; gap: 24px; font-size: 0.9rem; }
.home-links a { color: var(--muted); }
.section-label, .role-date, .blog-item time {
  font-family: "JetBrains Mono", monospace;
  font-size: 0.74rem;
  font-weight: 400;
  color: var(--muted);
}
.home-section { padding: 42px 0 12px; }
.section-label { text-transform: uppercase; margin: 0 0 26px; }
.home-section p { margin: 0 0 22px; }
.experience-item { padding-bottom: 24px; }
.role-head { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 12px; }
.role-head h3 { font-family: "Hanken Grotesk", sans-serif; font-size: 1rem; margin: 0; }
.role-head h3 span { display: block; font-weight: 400; color: var(--muted); }
.role-date { flex-shrink: 0; padding-top: 3px; }
.blog-header .lede { margin-bottom: 0; }
.blog-list { list-style: none; margin: 0; padding: 0; }
.blog-item { padding: 30px 0; border-bottom: 1px solid var(--line-soft); }
.blog-item h2 { font-size: 1.4rem; line-height: 1.4; margin: 10px 0; }
.blog-item h2 a { color: var(--text); text-decoration: none; }
.blog-item h2 a:hover { color: var(--accent); text-decoration: underline; }
.blog-item p { margin: 0; color: var(--muted); }
.empty-blog { padding: 30px 0; color: var(--muted); }
@media (max-width: 560px) {
  body { font-size: 16px; padding: 0 20px; }
  .post-header { padding: 52px 0 32px; }
  h1 { font-size: 2.1rem; }
  .lede { font-size: 1.08rem; }
  pre { padding: 16px; }
  .home-header { padding: 52px 0 36px; }
  .home-header h1 { font-size: 2.5rem; }
  .role-head { flex-direction: column; gap: 4px; }
}
@media print {
  .toggle, footer nav { display: none; }
  .post-header { padding-top: 32px; }
  pre { white-space: pre-wrap; }
}</style>
</head>
<body>
<div class="wrap">
<nav aria-label="Site navigation" class="topbar">
<a class="monogram" href="index.html">Mohamed Amin</a>
<button aria-label="Toggle dark mode" aria-pressed="false" class="toggle" hidden="" title="Toggle dark mode" type="button">
<span aria-hidden="true" class="theme-icon"></span>
</button>
</nav>
<main><header class="post-header blog-header"><div class="eyebrow">Writing</div><h1>Blog</h1><p class="lede">Notes on data engineering, architecture, and reliable systems.</p></header><ul class="blog-list"><li class="blog-item"><h2><a href="blog/Microsoft%20Fabric%20Integration%20Architecture.html">Microsoft Fabric Integration Architecture</a></h2></li></ul></main>
<footer>
<span>© 2026 Mohamed Amin</span>
<nav aria-label="Social links">
<a href="https://www.linkedin.com/in/modamin/">LinkedIn</a>
<a href="https://www.github.com/modamin">GitHub</a>
<a href="blog.html">Blog</a>
</nav>
</footer>
</div>
<script>
    (() => {
      const root = document.documentElement;
      const button = document.querySelector('.toggle');
      const syncButton = () => {
        const dark = root.dataset.theme === 'dark';
        button.setAttribute('aria-pressed', String(dark));
        button.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
        button.title = button.getAttribute('aria-label');
      };
      button.hidden = false;
      syncButton();
      button.addEventListener('click', () => {
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('theme', root.dataset.theme); } catch {}
        syncButton();
      });
    })();
  </script>
</body>
</html>
